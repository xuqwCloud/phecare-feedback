name: 🐞 Bug 反馈
description: App 闪退、记录异常、计算或显示错误、兼容性问题
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前须知
        - 请先搜索已有 Issue，避免重复反馈。
        - 请勿上传宝宝姓名、出生日期、医院、血值、完整饮食记录或备份文件。
        - 涉及计算问题时，请使用虚构或脱敏示例。
  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: 例如 iPhone 16 Pro
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: iOS 版本
      placeholder: 例如 iOS 18.6
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PheCare 版本
      placeholder: 例如 1.0 (1)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题模块
      options:
        - 引导与宝宝档案
        - 首页与饮食记录
        - 食物库
        - 血值记录
        - 成长记录
        - 数据导入导出
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可上传已彻底脱敏的截图或错误提示，请勿上传备份文件。
