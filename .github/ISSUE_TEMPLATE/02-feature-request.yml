name: 💡 功能建议
description: 新功能、流程优化或现有能力改进
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        请描述真实使用场景，但不要公开任何儿童身份或健康数据。
        本仓库不提供个体化诊疗或特殊配方用量建议。
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      placeholder: 你希望在什么情况下使用这项功能？
    validations:
      required: true
  - type: textarea
    id: pain
    attributes:
      label: 当前存在的问题
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 期望的实现方式
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 参考示例（可选）
      description: 可以提供其他 App 的公开界面或已脱敏示意图。
